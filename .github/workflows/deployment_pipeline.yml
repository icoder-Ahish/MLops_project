name: model deployment

on:
  workflow_dispatch:
  push:
    branches: [deploy-automation, main]
    paths:
      - '.github/workflows/deployment_pipeline.yml'
      - 'jobs/deploy.yml'
      - 'jobs/deployment.py'
jobs:
  deployment-job:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: 'icoder-Ahish/MLops_project'

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure Machine Learning
        run: bash setup.sh
        working-directory: cli
        continue-on-error: true

      - name: Create online endpoint if needed
        run: |
          az ml online-endpoint show --name ga-deployment >/dev/null 2>&1 || \
            az ml online-endpoint create --name ga-deployment

      - name: Register deployment environment (build & cache image)
        run: |
          az ml environment create \
            --name stock-deploy-env \
            --image mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest \
            --conda-file config/deployment_env.yml \
            --version ${{ github.run_number }} \
            2>/dev/null || \
          echo "Environment version already exists, continuing with latest."

      - name: Deploy model to endpoint
        working-directory: jobs
        run: |
          if az ml online-deployment show --name green --endpoint-name ga-deployment >/dev/null 2>&1; then
            echo "Deployment 'green' already exists — updating..."
            az ml online-deployment update -f deploy.yml
          else
            echo "Deployment 'green' does not exist — creating..."
            az ml online-deployment create -f deploy.yml --all-traffic
          fi
          az ml online-endpoint update --name ga-deployment --traffic green=100 || true

      - name: Fetch deployment logs (for debugging)
        if: always()
        run: |
          az ml online-deployment get-logs \
            --name green \
            --endpoint-name ga-deployment \
            --lines 200 || true