name: model deployment

on:
  workflow_dispatch:
  push:
    branches: [deploy-automation, main]
    paths:
      - '.github/workflows/deployment_pipeline.yml'
      - 'jobs/deploy.yml'
      - 'jobs/deployment.py'

jobs:
  deployment-job:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: 'icoder-Ahish/MLops_project'

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Azure ML
        run: bash setup.sh
        working-directory: cli
        continue-on-error: true

      # Endpoint creation is only required during the first run.
      # 'create' is idempotent-safe here: if the endpoint already exists the
      # command errors, which is fine — we continue anyway.
      - name: Create endpoint (first run only)
        run: az ml online-endpoint create --name ga-deployment
        continue-on-error: true

      # Try to create the deployment first (first run).
      # If it already exists, fall back to update.
      - name: Create deployment (first run)
        id: create_deployment
        run: az ml online-deployment create -f deploy.yml --all-traffic
        working-directory: jobs
        continue-on-error: true

      - name: Update deployment (subsequent runs)
        if: steps.create_deployment.outcome == 'failure'
        run: az ml online-deployment update -f deploy.yml
        working-directory: jobs

      - name: Set traffic to 100%
        if: steps.create_deployment.outcome == 'success'
        run: |
          az ml online-endpoint update \
            --name ga-deployment \
            --traffic "green=100"