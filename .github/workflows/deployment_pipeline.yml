name: model deployment

on:
  # workflow_dispatch:
  # push:
  #   branches: [deploy-automation, main]
  #   paths:
  #     - '.github/workflows/deployment_pipeline.yml'
  #     - 'jobs/deploy.yml'
  #     - 'jobs/deployment.py'
  #     - 'config/deployment_env.yml'
  #     - 'src/deployment_script.py'

jobs:
  deployment-job:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: 'icoder-Ahish/MLops_project'

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Azure ML
        run: bash setup.sh
        working-directory: cli
        continue-on-error: true

      - name: Create endpoint when needed
        run: |
          if az ml online-endpoint show --name ga-deployment >/dev/null 2>&1; then
            echo "Endpoint ga-deployment already exists."
          else
            az ml online-endpoint create --name ga-deployment
          fi

      - name: Create or update deployment
        run: |
          if az ml online-deployment show --endpoint-name ga-deployment --name green >/dev/null 2>&1; then
            az ml online-deployment update -f deploy.yml
          else
            az ml online-deployment create -f deploy.yml --all-traffic
          fi
        working-directory: jobs
