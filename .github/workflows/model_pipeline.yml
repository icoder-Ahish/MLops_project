name: Train and register model

env:
  job_name: ga-run-7
  compute_name: computer456
  compute_size: STANDARD_DS2_V2
  registered_model_name: GA_model

on:
  push:
    branches: [training-automation, main]
    paths:
      - .github/workflows/model_pipeline.yml
      - cli/setup.sh
      - jobs/train.py
      - jobs/train.yml
      - config/training_env.yml
  workflow_dispatch:

jobs:
  train-job:
    runs-on: self-hosted
    outputs:
      job_name: ${{ steps.submit-training.outputs.job_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: icoder-Ahish/MLops_project

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure Machine Learning
        run: bash setup.sh
        working-directory: cli

      - name: Create compute if needed
        run: |
          az ml compute show --name "$compute_name" >/dev/null 2>&1 || \
            az ml compute create \
              --name "$compute_name" \
              --size "$compute_size" \
              --min-instances 1 \
              --max-instances 2 \
              --type AmlCompute

      - name: Submit and wait for training job
        id: submit-training
        working-directory: jobs
        run: |
          job_name="$(az ml job create --file train.yml --stream --query name --output tsv)"
          echo "job_name=$job_name" >> "$GITHUB_OUTPUT"

  register-job:
    needs: train-job
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: icoder-Ahish/MLops_project

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure Machine Learning
        run: bash setup.sh
        working-directory: cli

      - name: Register model
        run: |
          az ml model create \
            --name "$registered_model_name" \
            --version 7 \
            --path "azureml://jobs/${{ needs.train-job.outputs.job_name }}/outputs/artifacts/paths/outputs/" \
            --type custom_model

  delete-compute:
    needs: train-job
    if: ${{ always() }}
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: icoder-Ahish/MLops_project

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure Machine Learning
        run: bash setup.sh
        working-directory: cli

      - name: Delete compute
        run: az ml compute delete --name "$compute_name" --yes || true
