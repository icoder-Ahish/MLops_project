name: Train and register model

env:
  job_name: ga-run-15
  compute_name: computer456
  compute_size: STANDARD_D2d_v5        
  registered_model_name: GA_model

on:
  push:
    branches: [training-automation, main]
    paths:
      - '**'

jobs:
  train-job:
    runs-on: self-hosted
    outputs:
      job_name: ${{ steps.submit-training.outputs.job_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: icoder-Ahish/MLops_project

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure Machine Learning
        run: bash setup.sh
        working-directory: cli

      - name: Create compute if needed
        run: |
          az ml compute show --name "${{ env.compute_name }}" >/dev/null 2>&1 || \
            az ml compute create \
              --name "${{ env.compute_name }}" \
              --size "${{ env.compute_size }}" \
              --min-instances 0 \
              --max-instances 2 \
              --type AmlCompute

      - name: Submit and wait for training job
        id: submit-training
        working-directory: jobs
        run: |
          # Build a unique Azure ML job name from GitHub run metadata.
          # This prevents "job already exists" and "not supported in this API version" errors.
          AML_JOB_NAME="ga-run-${{ github.run_id }}-${{ github.run_attempt }}"

          # IMPORTANT: Do NOT use --stream together with --query/--output tsv in the same command.
          # --stream dumps log lines (e.g. "Streaming user_logs/std_log.txt") to stdout,
          # which pollutes the captured variable and causes:
          #   "Error: Invalid format 'Streaming user_logs/std_log.txt'"
          # Fix: create the job first (capturing only the name), then stream logs separately.

          job_name="$(az ml job create \
            --file train.yml \
            --name "$AML_JOB_NAME" \
            --query name \
            --output tsv)"

          echo "Submitted Azure ML job: $job_name"

          # Stream job logs to GitHub Actions console (does not affect captured variables)
          az ml job stream --name "$job_name"

          echo "job_name=$job_name" >> "$GITHUB_OUTPUT"

  register-job:
    needs: train-job
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: icoder-Ahish/MLops_project

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure Machine Learning
        run: bash setup.sh
        working-directory: cli

      - name: Register model
        run: |
          az ml model create \
            --name "${{ env.registered_model_name }}" \
            --version 15 \
            --path "azureml://jobs/${{ needs.train-job.outputs.job_name }}/outputs/artifacts/paths/outputs/" \
            --type custom_model

  delete-compute:
    needs: train-job
    if: ${{ always() }}
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: icoder-Ahish/MLops_project

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure Machine Learning
        run: bash setup.sh
        working-directory: cli

      - name: Delete compute
        run: az ml compute delete --name "${{ env.compute_name }}" --yes || true
