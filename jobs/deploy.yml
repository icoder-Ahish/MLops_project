$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: green
endpoint_name: ga-deployment
model: azureml:GA_model:22
code_configuration:
  code: ../jobs
  scoring_script: deployment.py
# Build the serving environment from the versioned Conda definition in this
# repository.  Do not reference a manually registered environment version:
# those assets are workspace-local and may not exist in CI.
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest
  conda_file: ../config/deployment_env.yml
instance_type: Standard_DS3_v2
instance_count: 1
